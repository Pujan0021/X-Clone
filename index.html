<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>X</title>
  </head>
  <body>
    <section class="mainContainer">
      <div class="header">
        <button class="icon logo">
          <i class="fa-brands fa-x-twitter"></i>
        </button>
        <button class="icon">
          <i class="fa fa-home"></i><span class="option">Home</span>
        </button>
        <button class="icon">
          <i class="fa fa-search"></i><span class="option">Explore</span>
        </button>
        <button class="icon">
          <i class="far fa-bell"></i><span class="option">Notifications</span>
        </button>
        <button class="icon">
          <i class="fas fa-user-plus"></i><span class="option">Follow</span>
        </button>
        <button class="icon">
          <i class="far fa-envelope"></i><span class="option">Follow</span>
        </button>
        <button class="icon">
          <i class="fa fa-robot"></i><span class="option">Follow</span>
        </button>
        <button class="icon">
          <i class="far fa-bookmark"></i><span class="option">Follow</span>
        </button>
        <button class="icon">
          <i class="fa fa-flask"></i><span class="option">Follow</span>
        </button>
        <button class="icon">
          <i class="fa-brands fa-x-twitter"></i
          ><span class="option">Follow</span>
        </button>
        <button class="icon">
          <i class="far fa-user"></i><span class="option">Follow</span>
        </button>
        <button class="icon">
          <i class="fas fa-ellipsis-h"></i><span class="option">Follow</span>
        </button>
        <button class="icon">
          <i class="fa fa-pen-to-square"></i> <span class="option">Post</span>
        </button>
        <button class="icon">
          <span><img src="" alt="" /></span>
        </button>
      </div>
      <div class="subContainer">
        <div class="forYou scrollable">
          <div class="forYouPage">For you</div>
          <div class="scrollableItems">Following</div>
          <div class="scrollableItems">Software Engineering</div>
          <div class="scrollableItems">Web Developers</div>
          <div class="scrollableItems">Javascript Developers</div>
          <div class="scrollableItems">Build In Public</div>
        </div>
        <div class="postField">
          <button class="icon">
            <span><img src="" alt="profileImage" /></span>
          </button>
        </div>
      </div>
    </section>
  </body>
</html>
